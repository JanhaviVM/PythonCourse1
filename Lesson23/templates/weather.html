<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} Weather</title>
    <!-- this is where flask will insert the values when this file is called -->
    <link href="{{url_for('static', filename='styles/style.css')}}" rel="stylesheet" />
</head>

<body>
    <h1>{{title}} Weather</h1>
    <p>{{ status }} and {{ temp }} &deg;C</p>
    <p>Feels like {{ feels_like }} &deg;C</p>
    <!--  when we post our data from form, we get redirected to weather page -->
    <form action="/weather">
        <input type="text" name="city" id="city" placeholder="Enter a city" />
        <button type="submit">Submit</button>
    </form>
</body>

</html>
